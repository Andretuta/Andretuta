name: Atualiza o card de contribuições

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 em Brasília
    - cron: "17 15 * * *" # reforço: 12:17 em Brasília, caso a primeira execução atrase ou falhe
  workflow_dispatch:

permissions:
  contents: write

# Evita que duas execuções fiquem gerando/commitando o mesmo arquivo ao mesmo tempo.
concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o passo de salvar faz rebase e push, o que quebra em clone raso.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gera assets/stats.svg e assets/fame.svg
        env:
          # STATS_TOKEN (opcional): token com leitura do seu usuário, para somar as contribuições em
          # repositórios privados. Sem ele, o GITHUB_TOKEN conta só as públicas.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/stats.py ${{ github.repository_owner }}
      - name: Salva se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/fame.svg README.md
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última execução."
            exit 0
          fi
          git commit -m "Atualiza card de contribuições"
          # Se outra execução (ou você) enviou algo nesse meio-tempo, rebase e tenta de novo.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Cards atualizados e enviados para main."
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          echo "Não foi possível enviar as atualizações após 3 tentativas." >&2
          exit 1
