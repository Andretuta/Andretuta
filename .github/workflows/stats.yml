name: Atualiza o card de contribuições

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gera assets/stats.svg e assets/fame.svg
        env:
          # STATS_TOKEN (opcional): token com leitura do seu usuário, para somar as contribuições em
          # repositórios privados. Sem ele, o GITHUB_TOKEN conta só as públicas.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/stats.py ${{ github.repository_owner }}
      - name: Salva se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/fame.svg
          git diff --cached --quiet || git commit -m "Atualiza card de contribuições"
          git push
